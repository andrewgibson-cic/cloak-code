# CloakCode Universal Credentials Configuration
# This file defines credential mapping and injection strategies

version: "2.0"

# Global settings
settings:
  block_telemetry: true
  fail_on_error: true
  log_injections: true

# Credential definitions with strategies
credentials:
  # OpenAI API
  openai:
    strategy: "bearer"
    env_var: "OPENAI_API_KEY"
    dummy_patterns:
      - "DUMMY_OPENAI_KEY"
      - "sk-proj-.*DUMMY"
    allowed_hosts:
      - "api.openai.com"
      - "*.openai.com"
    injection:
      header: "Authorization"
      format: "Bearer {credential}"

  # Anthropic Claude API
  anthropic:
    strategy: "bearer"
    env_var: "ANTHROPIC_API_KEY"
    dummy_patterns:
      - "DUMMY_ANTHROPIC_KEY"
      - "sk-ant-.*DUMMY"
    allowed_hosts:
      - "api.anthropic.com"
      - "*.anthropic.com"
    injection:
      header: "x-api-key"
      format: "{credential}"

  # AWS (SigV4 signing)
  aws:
    strategy: "aws_sigv4"
    env_vars:
      access_key: "AWS_ACCESS_KEY_ID"
      secret_key: "AWS_SECRET_ACCESS_KEY"
      region: "AWS_DEFAULT_REGION"
    dummy_patterns:
      - "AKIA00000000DUMMYKEY"
      - "DUMMY_AWS_SECRET_KEY"
    allowed_hosts:
      - "*.amazonaws.com"
      - "bedrock-runtime.*.amazonaws.com"

  # GitHub API
  github:
    strategy: "git_pat"
    env_var: "GITHUB_TOKEN"
    dummy_patterns:
      - "DUMMY_GITHUB_TOKEN"
      - "ghp_.*DUMMY"
    allowed_hosts:
      - "api.github.com"
      - "github.com"
      - "*.github.com"
    injection:
      header: "Authorization"
      format: "token {credential}"

  # Google Gemini API
  google_gemini:
    strategy: "bearer"
    env_var: "GOOGLE_GEMINI_API_KEY"
    dummy_patterns:
      - "DUMMY_GOOGLE_GEMINI_API_KEY"
      - "DUMMY_GOOGLE_API_KEY"
    allowed_hosts:
      - "generativelanguage.googleapis.com"
      - "*.googleapis.com"
    injection:
      query_param: "key"

  # IBM WatsonX / OpenAI Compatible
  ibm_openai:
    strategy: "bearer"
    env_var: "IBM_OPENAI_API_KEY"
    dummy_patterns:
      - "DUMMY_IBM_OPENAI_KEY"
      - "DUMMY_IBM_WATSONX_KEY"
    allowed_hosts:
      - "*.cloud.ibm.com"
      - "api.watsonx.ai"
    injection:
      header: "Authorization"
      format: "Bearer {credential}"

  # Mistral AI
  mistral:
    strategy: "bearer"
    env_var: "MISTRAL_API_KEY"
    dummy_patterns:
      - "DUMMY_MISTRAL_KEY"
    allowed_hosts:
      - "api.mistral.ai"
      - "*.mistral.ai"
    injection:
      header: "Authorization"
      format: "Bearer {credential}"

# Telemetry blocking rules
telemetry_blocks:
  - "*.sentry.io"
  - "*.bugsnag.com"
  - "analytics.google.com"
  - "*.segment.com"
  - "*.mixpanel.com"
  - "telemetry.anthropic.com"