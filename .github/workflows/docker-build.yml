name: Docker Build and Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build proxy image
      run: |
        echo "Building proxy image..."
        docker build -f proxy/Dockerfile.secure -t cloakcode-proxy:latest proxy/ || docker build -f proxy/Dockerfile -t cloakcode-proxy:latest proxy/
    
    - name: Build agent image
      run: |
        echo "Building agent image..."
        docker build -f agent/Dockerfile.secure -t cloakcode-agent:latest agent/ || docker build -f agent/Dockerfile -t cloakcode-agent:latest agent/
    
    - name: Test proxy image
      run: |
        echo "Testing proxy image..."
        docker run --rm --user root cloakcode-proxy:latest mitmdump --version
    
    - name: Test agent image  
      run: |
        echo "Testing agent image..."
        docker run --rm cloakcode-agent:latest node --version
    
    - name: Run Trivy security scan on proxy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'cloakcode-proxy:latest'
        format: 'sarif'
        output: 'trivy-proxy-results.sarif'
        severity: 'HIGH,CRITICAL'
        exit-code: '0'
    
    - name: Run Trivy security scan on agent
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'cloakcode-agent:latest'
        format: 'sarif'
        output: 'trivy-agent-results.sarif'
        severity: 'HIGH,CRITICAL'
        exit-code: '0'
    
    - name: Upload proxy Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-proxy-results.sarif'
        category: 'proxy-image'
    
    - name: Upload agent Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-agent-results.sarif'
        category: 'agent-image'
    
    - name: Build summary
      if: always()
      run: |
        echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "✅ Proxy image built successfully" >> $GITHUB_STEP_SUMMARY
        echo "✅ Agent image built successfully" >> $GITHUB_STEP_SUMMARY
        echo "✅ Security scans completed" >> $GITHUB_STEP_SUMMARY